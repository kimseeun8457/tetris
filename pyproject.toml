[project]
name = "tetris"
version = "0.1.0"
description = "Single-page browser Tetris game"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["flask>=3.1,<4"]

[project.scripts]
tetris = "tetris.server:main"


[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"
